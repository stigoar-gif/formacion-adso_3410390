
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proyecto CSS Avanzado</title>

    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Equipo de Desarrollo</h1>
    </header>

    <main>

        <section class="perfil">
            <h2>Perfil del Usuario</h2>

            <div class="perfil-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQ68aBD7v6kNGkMlUCaSAf84xMGTnTvN43XFzlthNJ1w&s=10" alt="Usuario">
                <h3>Juan Pérez</h3>
                <p>Desarrollador Frontend</p>
            </div>
        </section>

        <section class="equipo">

            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTvhWyaMt-8sYP54nsntzRMmufCMQV7JsMQ-NMeY_KH2Q&s=10" alt="">
                <h3>Ana</h3>
                <p>Frontend</p>
            </div>

            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRv9uKxYztjeHCaoMBRd48jGRcX1G4rjblQRFnQirTnqA&s=10=" alt="">
                <h3>Carlos</h3>
                <p>Backend</p>
            </div>

            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcTHe_hdWx1n4jugJThuiQEaoo5iJM-MHhp7RyzZGclg&s=10" alt="">
                <h3>María</h3>
                <p>UX/UI</p>
            </div>

        </section>

        <section class="botones">
            <button>Enviar Formulario</button>
        </section>

        <section class="faq">

            <h2>Preguntas Frecuentes</h2>

            <details>
                <summary>¿Qué tecnologías usan?</summary>
                <p>HTML, CSS y JavaScript.</p>
            </details>

            <details>
                <summary>¿Trabajan remoto?</summary>
                <p>Sí.</p>
            </details>

            <details>
                <summary>¿Aceptan aprendices?</summary>
                <p>Sí, constantemente.</p>
            </details>

        </section>

        <section class="carga">
            <div class="loader"></div>
        </section>

    </main>

    <footer>
        <p>© 2026 Equipo Desarrollo</p>
    </footer>
</body>
</html>

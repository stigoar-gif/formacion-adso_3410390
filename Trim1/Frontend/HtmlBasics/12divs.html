<!DOCTYPE html>
<html lang="en">
<head>

    <!-- header: Cabecera -->
     <!-- NAV: menú - enlaces importantes -->
      <!-- section: sección o tema -->
       <!-- article: Articulo q se puede dllar dentro de una seccion  -->
        <!-- aside: información complementaria -->
         <!-- main: sección principal -->
          <!-- footer: pie de pagina-->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura Divs</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        div.main{
            border: 2px solid #000;
            color: #575454;
            font-size: 1rem;
            padding: 1.5rem;
            div.header{
                background-color: antiquewhite;
                border: 2px solid #000;
                padding: 1rem;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            div.content{
                background-color: rgba(66, 114, 135, 0.712);
                border: 2px solid #000;
                padding: 1rem;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                margin: .7rem 0;
                min-height: 200px;
            }
            div.footer{
                background-color: rgba(0, 34, 255, 0.478);
                border: 2px solid #000;
                padding: 1rem;
                display: flex;
                flex-direction: column;
                justify-content: center;
                margin: .7rem 0;
            }
            div.biografia{
                background-color: rgb(255, 0, 0);
                border: 2px solid #000;
                padding: 1rem;
                width: 80%;
                margin: 0.5rem 0;
            }
            div.resumen{
                background-color: rgb(255, 0, 0);
                border: 2px solid #000;
                padding: 1rem;
                width: 80%;
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>12. Estructura Divs</h1>
        <h2>Con esta etiqueta podemos generar una estructura en el Sitio web (forma antigua)</h2>
    </header>
    <section>
        <div class="main">
            <div class="header">
                <h4>Este es el header</h4>
                <p>Acá podemos colocar un título o frase corta</p>
            </div>
            <div class="content">
                <h4>Este es el DIV para el contenido</h4>
                <div class="biografia"></div>
                <div class="resumen"></div>
            </div>
            <div class="footer">
                <h4>Este es el Pie de página</h4>
            </div>
        </div>
    </section>
</body>
</html>

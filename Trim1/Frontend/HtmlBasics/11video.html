<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11. video</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <h1>11. video</h1>
    <h2>esta etiqueta permite insertar un video</h2>
    <header>
        <section>
            <!-- Loop: permite repetir el video -->
            <video 
            src="video/HTML5.mp4" 
            controls
            autoplay
            muted
            loop
            width="100%"
            ></video>
        </section>
    </header>
</body>
</html>
